<style>

.tab{border:none;background:none;padding:7px 12px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:4px;font-size:12.5px}.kpi{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px 8px 4px 0;min-width:150px}.kpi b{font-size:20px;display:block}
tr.click{cursor:pointer}tr.click:hover{background:#f2f6fb}

a.ql{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc)}
.qleg{font:12px/1.6 ui-monospace,Menlo,monospace;background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 0}
.tbrowse{overflow-x:auto;padding:6px 0}.tn{display:flex;flex-direction:column;align-items:center;min-width:0}.tbox{border:2px solid #cbd2dc;border-radius:8px;padding:6px 9px;background:#fff;max-width:230px;text-align:center;cursor:pointer;font-size:13px}.tbox:hover{border-color:#1d2433}.tbox.on{border-color:#2f855a;box-shadow:0 0 0 3px #c6f6d5}.tbox.dim{opacity:.45}.tbox.leaf{cursor:default}.tkids{display:flex;gap:10px;justify-content:center;margin-top:6px;padding-top:6px;border-top:2px solid #cbd2dc}.tk{display:flex;flex-direction:column;align-items:center;flex:1}.tedge{font-size:11px;color:#667;margin-bottom:3px}
.crumb{font-size:13px;margin-bottom:6px}.obrowse{overflow-x:auto}.orow{display:flex;gap:10px;align-items:flex-start;margin-top:8px;flex-wrap:wrap}.ocol{display:flex;flex-direction:column;gap:4px;margin-top:6px;margin-left:10px}.obox{border:1px solid #cbd2dc;border-radius:6px;padding:4px 7px;background:#fff;font-size:12.5px;max-width:320px;cursor:pointer}.obox:hover{border-color:#1d2433}.bar{height:4px;background:#edf0f4;margin-top:3px}.bar span{display:block;height:4px}
.xg{border:1px solid #e4e7ec;border-radius:8px;padding:6px 8px;background:#fff;max-width:330px}.xrow{display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid #e4e7ec;padding-top:8px;margin-top:8px}.xt{border-collapse:collapse;margin-top:4px;font-size:11.5px}.xt td,.xt th{padding:2px 4px;border:1px solid #eef0f3}.xn{border-top:1px solid #e4e7ec;padding:8px 0}.xn>summary{cursor:pointer}.xsec{margin:12px 0 4px;padding-top:6px;border-top:1px solid #eef0f3}.xhow{background:#f7f8fa;border:1px solid #e4e7ec;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:13px}.xhow ul{margin:4px 0 0 18px;padding:0}.xterm{border-top:1px dashed #e4e7ec;padding:4px 0;margin-left:14px}.xterm>summary{cursor:pointer}.xgroup{border-top:1px solid #d5d9e0;padding:6px 0;margin-left:10px}.xgroup>summary{cursor:pointer}.xchip{display:inline-block;font-size:10.5px;border:1px solid #cbd2dc;border-radius:4px;padding:0 3px;margin-right:2px;color:#99a}.xchip.on{background:#1d2433;color:#fff;border-color:#1d2433}.xchip.mid{background:#cbd2dc;color:#1d2433}.xcode{font-size:12px;background:#f3f5f8;padding:1px 4px;border-radius:4px;display:inline-block;vertical-align:middle}.xpre{font-size:12px;background:#f7f8fa;padding:8px;max-height:420px;overflow:auto}.xhead{cursor:pointer}.xbadge{font-size:11px;border-radius:9px;padding:1px 7px;margin-left:4px;border:1px solid #cbd2dc}.xmajor{background:#1d2433;color:#fff}.xmoderate{background:#e4e7ec}.xminor{background:#fff;color:#667}
.tjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:8px}.tjcard{border:1px solid #e4e7ec;border-radius:8px;padding:6px 8px;background:#fafbfc;cursor:pointer;opacity:.75}.tjcard.on{background:#fff;opacity:1;border-color:#9aa3b0}.tjcard.open{box-shadow:0 0 0 2px #1d2433}.tjpill{font-size:10.5px;border-radius:8px;padding:0 6px;background:#e4e7ec;color:#667;height:16px}.tjpill.on{background:#2f855a;color:#fff}.tjdetail{grid-column:1/-1;border:1px solid #1d2433;border-radius:8px;padding:8px;background:#fff}
.xhl{border:2px solid #c05621;border-radius:10px;padding:4px 10px;background:#fffaf5;margin:6px 0}.xhlbadge{display:inline-block;background:#c05621;color:#fff;border-radius:10px;padding:0 8px;font-size:12px;font-weight:600}.xhlnote{border-left:4px solid #c05621;background:#fff3ea;padding:6px 10px;margin:4px 0 8px;border-radius:4px}
.xsum{background:#f6f8fa;border:1px solid #e4e7ec;border-radius:8px;padding:8px 10px;margin:4px 0 8px}details.xsecd{border-top:1px solid #e4e7ec;padding:6px 0}details.xsecd>summary{cursor:pointer}
</style></head><body><main>
<h1></h1>
<div class="cnt" id="sub" style="margin-bottom:6px"></div>
<div id="bar"></div>
<section id="p-results"><div id="results"></div></section>
<section id="p-explain" hidden><div id="explain"></div></section>
<section id="p-scores" hidden><div id="scores"></div></section>
<section id="p-tryjet" hidden><div id="tryjet"></div></section>
<section id="p-made" hidden><div id="made"></div></section>
<section id="p-python" hidden><div id="python"></div></section>
</main>
<script>
const D=/*DATA*/;const ROS=true;const CL=D.classes,COL={g:'#2f855a',q:'#2b6cb0',W:'#c05621',Z:'#6b46c1',t:'#c53030'};
const pct=v=>(100*v).toFixed(1)+'%',fr=v=>v==null?'—':v>=1e5?'∞':v>=100?v.toFixed(0):v.toFixed(1);
const num=x=>{x=+x;if(!isFinite(x))return String(x);if(Math.abs(x)>=1000)return x.toFixed(0);for(let p=3;p<=7;p++){const s=x.toPrecision(p);if(x===Math.round(x)||Number(s)!==Math.round(Number(s)))return String(Number(s))}return String(x)};
const qpop=q=>{let el=document.getElementById('qpop');if(!el){el=document.createElement('div');el.id='qpop';document.body.appendChild(el)}const d=(D.defs||{})[q];el.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(q)}</b><span style="cursor:pointer;font-weight:700" onclick="document.getElementById('qpop').remove()">×</span></div><div style="margin-top:4px">${d?esc(d):'<span class="cnt">no description</span>'}</div>`};
const qa=q=>`<a href="#" class="ql" onclick="qpop(decodeURIComponent('${encodeURIComponent(q)}'));return false">${esc(q)}</a>`;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const el=document.getElementById('qpop');if(el)el.remove()}});
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cur=v=>LEN=='long'?D.versions[v]:LEN=='sr'?((D.sr||{})[v]):((D.compact||{})[v]||{})[LEN];
let QN={};const qn=q=>/^S\d+$/.test(q)?q:(QN[q]||q);
const tval=t=>`${num(t)}`;
const massNote=(t)=>{for(const [k,m] of Object.entries(D.masses))for(const c of [.5,1,1.5,2])if(Math.abs(t-c*m)<1e-6)return ` (${c==1?'':c+'×'}${k.replace('m_','m_')})`;return ''};
const shapeTxt=(q,k,p,mu,sd)=>k=='lin'?qn(q):k=='sq'?`${qn(q)}²`:k=='cube'?`${qn(q)}³`:k=='sqrt'?`√${qn(q)}`:k=='log'?`log ${qn(q)}`:k=='exp'?`exp((${qn(q)} − ${num(mu)}) / ${num(sd)})`:k=='bump'?`exp(−((${qn(q)} − ${num(p[0])}${massNote(p[0])}) / ${num(p[1])})²)`:k=='gt'?`(${qn(q)} − ${num(p)})`:`(${num(p)} − ${qn(q)})`;
const pieceCode=(tm,ind,coef)=>{if('p' in tm){const conds=[];if(tm.kind=='gt'||tm.kind=='lt')conds.push(`${qn(tm.q)} ${tm.kind=='gt'?'>':'<'} ${num(tm.p)}${massNote(tm.p)}`);if(tm.q2&&(tm.kind2=='gt'||tm.kind2=='lt'))conds.push(`${qn(tm.q2)} ${tm.kind2=='gt'?'>':'<'} ${num(tm.p2)}${massNote(tm.p2)}`);
 const val=`${num(coef)} * ${shapeTxt(tm.q,tm.kind,tm.p,tm.mu,tm.sd)}${tm.q2?` * ${shapeTxt(tm.q2,tm.kind2,tm.p2,tm.mu2,tm.sd2)}`:''}`;return conds.length?[`${ind}if ${conds.join(' and ')}:`,`${ind}    z += ${val}`]:[`${ind}z += ${val}`]}const one=(q,k,t)=>k=='lin'?qn(q):k=='gt'?`(${qn(q)} − ${tval(t)})`:`(${tval(t)} − ${qn(q)})`;
 const conds=[];if(tm.kind!='lin')conds.push(`${qn(tm.q)} ${tm.kind=='gt'?'>':'<'} ${tval(tm.t)}${massNote(tm.t)}`);if(tm.q2){if(tm.kind2!='lin')conds.push(`${qn(tm.q2)} ${tm.kind2=='gt'?'>':'<'} ${tval(tm.t2)}${massNote(tm.t2)}`)}
 const val=`${num(coef)} * ${one(tm.q,tm.kind,tm.t)}${tm.q2?` * ${one(tm.q2,tm.kind2,tm.t2)}`:''}`;
 return conds.length?[`${ind}if ${conds.join(' and ')}:`,`${ind}    z += ${val}`]:[`${ind}z += ${val}`]};
const wrapT=(t,w)=>{const out=[];let line='';for(const x of String(t).split(' ')){if((line+' '+x).trim().length>w){if(line)out.push(line.trim());line=x}else line+=' '+x}if(line.trim())out.push(line.trim());return out};
const termLine=t=>{const L=pieceCode(t,'',t.coef),v=(L.length>1?L[1]:L[0]).replace(/^\s*z \+= /,'').replace(/ \* /g,' × ');const m=L.length>1?L[0].match(/^if (.*):$/):null;const w=v.startsWith('-')?`subtracts ${v.slice(1)}`:`adds ${v}`;return m?`${w} when ${m[1]}`:`${w} always`};
const qsOf=S_=>[...new Set(S_.pieces.map(p=>p.q).concat((S_.shapes||[]).map(t=>t.q),S_.products.flatMap(t=>[t.q,t.q2])))];
const setQNs=S_=>{QN={};let k=0;for(const q of qsOf(S_))if(!/^S\d+$/.test(q)&&!(q in QN))QN[q]='Q'+(++k);return QN};
const lineTxt=(sl,of,q)=>{const a=Math.abs(sl)>1e-12?`${num(sl)}·${qn(q)}`:'';const b=Math.abs(of)>1e-12?`${of<0&&a?'− ':a?'+ ':''}${num(a?Math.abs(of):of)}`:'';return (a+' '+b).trim()||'0'};
function hist(h){const W=420,H=180,L=36,B=26,bn=h.bins,n=bn.length-1,mx=Math.max(...h.real,...h.formula,1);const px=i=>L+i*(W-L-8)/n,py=v=>H-B-(v/mx)*(H-B-10);
 const line=(arr,col,dash)=>`<path d="${arr.map((v,i)=>`${i?'L':'M'}${px(i).toFixed(1)},${py(v).toFixed(1)} L${px(i+1).toFixed(1)},${py(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="1.6" ${dash?'stroke-dasharray="4 3"':''}/>`;
 return `<svg width="${W}" height="${H}"><rect x="${L}" y="4" width="${W-L-8}" height="${H-B-4}" fill="#fff" stroke="#d0d5dd"/>${line(h.real,'#1d2433')}${line(h.formula,'#2b6cb0')}
 <text x="${L}" y="${H-10}" font-size="9">${num(bn[0])}</text><text x="${W-8}" y="${H-10}" font-size="9" text-anchor="end">${num(bn[n])}</text><text x="${(L+W)/2}" y="${H-2}" font-size="9.5" text-anchor="middle">neuron value (jets with value 0 not drawn)</text></svg>`}
let TAB='results';const TABS=[['results','Results'],['explain','Neuron Interpretation'],['scores','Class-Score Decomposition'],['tryjet','Per-Jet Evaluation'],['made','Methodology'],['python','Python Implementation']];
function drawBar(){document.getElementById('bar').innerHTML=`<div>${TABS.map(([k,l])=>`<button class="tab${k==TAB?' on':''}" onclick="TAB='${k}';show()">${l}</button>`).join('')}</div>`}
function show(){for(const [k] of TABS){const e=document.getElementById('p-'+k);if(e)e.hidden=k!=TAB}redraw();window.scrollTo(0,0)}
let TV=null;
const tnode=(nd,path)=>{if(nd.leaf)return `<span class="pill" style="background:${COL[nd.leaf]}">${nd.leaf}</span> <span class="cnt">${nd.n.toLocaleString()} fit jets, ${pct(nd.purity)} of them decided ${nd.leaf} by the network</span>`;
 return `<details data-p="${path}" ontoggle="if(this.open&&!this.dataset.done){this.dataset.done=1;this.querySelector('div').innerHTML=tkids(this.dataset.p)}"><summary>if ${qa(nd.q)} ≤ ${num(nd.t)} <span class="cnt">(${nd.n.toLocaleString()} jets)</span></summary><div style="margin-left:18px;border-left:1px solid var(--line);padding-left:8px"></div></details>`};
const tget=path=>{let nd=D.tree.variants[TV].tree;for(const c of path.split('').filter(Boolean))nd=c=='l'?nd.le:nd.gt;return nd};
window.tkids=path=>{const nd=tget(path);return `<div><b>yes:</b> ${tnode(nd.le,path+'l')}</div><div><b>no</b> (${esc(nd.q)} > ${num(nd.t)}): ${tnode(nd.gt,path+'g')}</div>`};
let PYSEL=null;
let FT=null,FK='scoretree',FPATH=[],FJ=null,FJI=-1,FJSRC='',FBIG={},PYO=null,NODES=[],FMSG='';
const KINDS=[['formula','the formula (class score → neurons → if-statements)'],['scoretree','small tree + score tests'],['tree','small tree (quantities only)'],['scoretree_big','bigger tree + score tests'],['tree_big','bigger tree (quantities only)']];
const fmt=v=>{const a=Math.abs(v);return a===0?'0':a>=100?v.toFixed(1):a>=1?v.toFixed(3):a>=0.01?v.toFixed(4):v.toPrecision(3)};
function fpiece(Q,q,k,t){const x=Q[q];return k==='lin'?x:(k==='gt'?Math.max(0,x-t):Math.max(0,t-x))}
function ftermV(Q,t){return fpiece(Q,t.q,t.kind,t.t)*(t.q2?fpiece(Q,t.q2,t.kind2,t.t2):1)}
function fReadable(t){const p=(q,k,th)=>k==='lin'?q:(k==='gt'?`${q} > ${fmt(th)}`:`${q} < ${fmt(th)}`);return p(t.q,t.kind,t.t)+(t.q2?' and '+p(t.q2,t.kind2,t.t2):'')}
function fFormula(tag,Q){const F=D.forms[tag].norm,L=D.last,h=[],z=[],tv={};
 for(const nr of F.neurons){let s=nr.c*nr.scale;tv[nr.neuron]=nr.terms.map(t=>{const v=t.coef*ftermV(Q,t);s+=v;return v});z[nr.neuron]=s;const f=L.f7[nr.neuron],i=L.i7[nr.neuron];h[nr.neuron]=(Math.floor(Math.max(s,0)*2**f+0.5)/2**f)%(2**i)}
 const lg=CL.map((c,ci)=>L.b7[ci]+h.reduce((a,v,j)=>a+v*L.K7[j][ci],0));return {h,z,tv,lg,cls:lg.indexOf(Math.max(...lg))}}
function fScores(T,Q){const S=T.scores;if(!S)return null;return CL.map((c,ci)=>S.b[ci]+S.terms.reduce((a,t,k)=>a+S.coef[k][ci]*ftermV(Q,t),0))}
function fVal(f,Q,S){return f.startsWith('s_')?S[CL.indexOf(f[2])]-S[CL.indexOf(f[4])]:Q[f]}
function fWalk(T,Q){const S=fScores(T,Q),path=new Set();let nd=T.tree;while(!('leaf' in nd)){path.add(nd);nd=fVal(nd.f,Q,S)>nd.t?nd.gt:nd.le}path.add(nd);return {path,leaf:nd,S}}
function fLeaves(nd){if(nd._n)return nd._n;return nd._n=('leaf' in nd)?1:fLeaves(nd.le)+fLeaves(nd.gt)}
function fTree(){const fm=D.forms[FT];if(FK in fm.trees)return fm.trees[FK];return FBIG[FT+FK]||null}
async function fLoadBig(){const k=FT+FK;if(FBIG[k]||FBIG[k+'!'])return;FBIG[k+'!']=1;FMSG='loading the bigger tree …';drawFormulas();
 try{const r=await fetch(`formtree_n${D.n}_${FT}_${FK}.json`);FBIG[k]=await r.json();FMSG=''}catch(e){FMSG='could not load the bigger tree here (open the page from the website)'}drawFormulas()}
function treeGo(i){FPATH.push(NODES[i]);drawFormulas()}
function fTNode(nd,depth,ctx){const on=ctx.path&&ctx.path.has(nd),dim=ctx.path&&!on;
 if('leaf' in nd){const c=CL[nd.leaf];return `<div class="tn"><div class="tbox leaf${on?' on':''}${dim?' dim':''}" style="border-color:${COL[c]}"><b style="color:${COL[c]};font-size:16px">${c}</b><div class="cnt">the formula gives ${c} to ${Math.round(100*nd.share)}% of the ${nd.jets.toLocaleString()} training jets here</div>${on?'<div class="cnt"><b>← this jet ends here</b></div>':''}</div></div>`}
 const id=NODES.push(nd)-1,lab=nd.f.startsWith('s_')?`score<sub>${nd.f[2]}</sub> − score<sub>${nd.f[4]}</sub>`:esc(nd.f);
 let val='';if(ctx.Q){const v=fVal(nd.f,ctx.Q,ctx.S);val=`<div class="cnt">this jet: ${fmt(v)} → <b>${v>nd.t?'yes':'no'}</b></div>`}
 const box=`<div class="tbox${on?' on':''}${dim?' dim':''}"${depth?` onclick="treeGo(${id})" title="click: show from here"`:''}><b>${lab} &gt; ${fmt(nd.t)} ?</b>${val}<div class="cnt">${fLeaves(nd)} leaves below${depth==2?' · <b>click to go deeper ▾</b>':''}</div></div>`;
 if(depth>=2)return `<div class="tn">${box}</div>`;
 return `<div class="tn">${box}<div class="tkids"><div class="tk"><div class="tedge">no</div>${fTNode(nd.le,depth+1,ctx)}</div><div class="tk"><div class="tedge">yes</div>${fTNode(nd.gt,depth+1,ctx)}</div></div></div>`}
function fFormulaNodes(){const fm=D.forms[FT],F=fm.norm,C=F.classes;const R=FJ?fFormula(FT,FJ):null;const byN={};for(const nr of F.neurons)byN[nr.neuron]=nr;
 const neuron=j=>{const nr=byN[j];return {kind:'neuron',j,lab:`neuron ${j}`,sub:`${(100*C.neuron_importance[j]).toFixed(1)}% of all class scores`+(R?` · this jet: h = ${fmt(R.h[j])}${R.z[j]<=0?' (off)':''}`:''),
  kids:nr.terms.map((t,k)=>({kind:'term',lab:fReadable(t),sub:`${t.share>=0?'+':''}${(100*t.share).toFixed(1)}% of this neuron’s input`+(R?` · this jet adds ${fmt(R.tv[j][k])}`:''),share:t.share}))}};
 return {kind:'root',lab:'the 5 class scores',sub:R?`this jet: ${CL[R.cls]}`:'',kids:CL.map((c,ci)=>{const sh=[...Array(16).keys()].map(j=>[j,C.share[j][ci]]).filter(x=>x[1]!==0).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  return {kind:'class',c,lab:`score ${c}`,sub:R?`this jet: ${fmt(R.lg[ci])}`:'',kids:sh.map(([j,s])=>Object.assign(neuron(j),{sub2:`${s>=0?'+':''}${(100*s).toFixed(0)}% of score ${c}`}))}})}}
function fONode(nd,depth){const id=NODES.push(nd)-1,kids=nd.kids||[],col=nd.c?COL[nd.c]:'#1d2433';
 const box=`<div class="obox"${depth&&kids.length?` onclick="treeGo(${id})" title="click: show from here"`:''} style="border-left:4px solid ${col}"><b>${esc(nd.lab)}</b>${nd.sub2?` <span class="cnt">${nd.sub2}</span>`:''}<div class="cnt">${nd.sub||''}</div>${depth==2&&kids.length?`<div class="cnt"><b>${kids.length} below · click ▾</b></div>`:''}${nd.kind==='term'?`<div class="bar"><span style="width:${Math.min(100,Math.abs(100*nd.share)*2)}%;background:${nd.share>=0?'#2f855a':'#c53030'}"></span></div>`:''}</div>`;

 <li><b>At the network’s accuracy → 549 terms.</b> The same simplification started instead from the longer tuned formula (100 terms per neuron pruned to 931 terms, 65.85 % test), with the floor set to the network’s own validation accuracy (65.72 %): the smallest formula that stays at or above it has 549 terms, 863 if-conditions, 75 quantities: <b>65.80 % test (network 65.76 %)</b>. 500 terms already fall just short (65.70 % validation).</li>
 <li><b>Fewest quantities → 300 terms on 24 quantities.</b> From the same run: at the main result’s accuracy, a formula that needs only 24 quantities (the main result needs 39): 300 terms, 430 if-conditions, 65.49 % test.</li></ol></div>`;
 if(fk.length&&D.n==64)h+=`<div class="card"><b>How the formulas were reduced (network → 686 → 399 / 200 / 150 / 99 terms)</b>
 <div class="cnt" style="margin:4px 0">Exactly the same steps and rules as for 8 particles (all choices on training / validation jets; test jets used once at the end):</div>
 <ol class="cnt" style="margin:6px 0 0 18px;padding:0">
 <li><b>From the network to formulas</b>: each of the 16 neurons of the last hidden layer written as a sum of terms of jet quantities (MARS, neuron by neuron).</li>
 <li><b>Tuned end to end</b>: the first 60 terms of every neuron (960 terms), all coefficients trained together through the network’s own last layer: 81.58 % test (network 81.08 %).</li>
 <li><b>Pruned with retraining</b> (validation accuracy within 0.1 point): 694 terms.</li>
 <li><b>Checked with the training data → 686 terms</b> (the tuned formula, start): 8 if-statements that fire but never change a class removed; 908 if-conditions, 98 quantities, 81.46 % test.</li>
 <li><b>Simplified with the training data → 150 terms</b> (main result): backward elimination refitting each neuron to the 686-term formula’s own neuron values, a candidate pool of simple hinges, 4 rounds of removing the whole quantities that cost least (98 → 52 quantities used), thresholds refined and rounded to 3 significant digits. Chosen as the smallest formula within 0.4 point of the start on validation jets: 150 terms, 199 if-conditions, 52 quantities, 81.07 % validation, <b>81.02 % test</b> (network 81.08 %).</li>
 <li><b>Simpler version → 99 terms</b>: the smallest within 1 point (thresholds at 2 significant digits): 125 if-conditions, 38 quantities, 80.45 % test.</li>
 <li><b>Closer to the start → 399 terms</b> (asked for: the 150-term version lost too much): the smallest within 0.1 point of the start on validation jets: 519 if-conditions, 61 quantities, 81.41 % test (+0.33 over the network).</li>
 <li><b>Fewest quantities at the network’s accuracy → 200 terms on 31 quantities</b>: 241 if-conditions, 81.07 % test (network 81.08 %); its tree with score tests needs only 24 leaves.</li></ol></div>`;
 h+=`<div class="card"><b>How the direct classification trees were made</b><ol class="cnt" style="margin:6px 0 0 18px;padding:0">
 <li><b>Labels from the formula, not from the truth.</b> The formula was run on the entire training set (595,000 jets, the training file minus the validation jets). Each jet is labelled with the <i>formula’s</i> class, so the tree learns to copy the formula.</li>
 <li><b>Tests.</b> A test is either “quantity &gt; threshold” (a jet quantity the formula uses) or “score<sub>c</sub> − score<sub>d</sub> &gt; threshold”. The scores are 5 plain sums of the formula’s own terms (<code>coef·max(0, Q − t)</code>, …), fitted to reproduce the formula’s class probabilities. Why the scores: near the decision boundary the formula’s class is decided by a sum of about 20 terms. A tree of single-quantity tests follows that sloped boundary only in many small steps (there it agreed with the formula on only ~65% of jets); one score test follows it at once.</li>
 <li><b>Growing.</b> A standard decision tree (at least 25 training jets per leaf), grown best-first up to a leaf budget; leaves under the same test that give the same class are merged.</li>
 <li><b>Choosing the size on validation jets.</b> Small tree = the smallest (at most 64 leaves) within 0.1 point of the best small tree; bigger tree = the smallest of any size within 0.05 point of the best.</li>
 <li><b>Pruning the scores.</b> For the small tree, the weakest score terms (|coefficient| × spread) are removed and the rest refitted, as long as the tree stays within 0.1 point on validation jets.</li>
 <li><b>Checking.</b> Each tree is written as a Python file of nested if-statements, and that file is run from the particles of every test jet: it gives exactly the tree’s class. Accuracy, same class as the formula and same class as the network are then counted on the test jets.</li></ol></div>`;
h+=`${fk.some(t=>P['formula '+t+' normalized'])?`<div class="cnt" style="margin:10px 0 2px"><b>How much each neuron matters</b> (from the normalized files: share of all class scores, weights × the neuron’s average output on the training jets):</div><div style="overflow-x:auto"><table><tr><th>formula</th>${[...Array(16).keys()].map(j=>`<th class="num">n${j}</th>`).join('')}</tr>${fk.filter(t=>P['formula '+t+' normalized']).map(t=>{const v=P['formula '+t+' normalized'].neuron_importance,m=Math.max(...v);return `<tr><td><b>${t}</b></td>${v.map(x=>`<td class="num" style="background:rgba(47,133,90,${(0.85*x/m).toFixed(2)})">${(100*x).toFixed(0)}%</td>`).join('')}</tr>`}).join('')}</table></div>`:''}`;
 if((D.fpga||{}).netalg){const N=D.fpga.netalg;h+=`<div class="card" style="border-left:4px solid #1d2433"><b>The network's own algorithm, pulled out and simplified</b><div class="cnt" style="margin:4px 0">The quantized network IS a finite algorithm: fixed-point multiply-adds, each max(0, ·) an if-statement. Written out as plain code it gives bit-for-bit the network's class scores (for every possible input, not only these jets); then simplified: first only with changes proven exact for every input, then with the training jets (no training, nothing generated). Counts per jet (each particle's copy of a neuron counted). Code: <a href="${N.files.exact}">${N.files.exact}</a> · <a href="${N.files.simplified}">${N.files.simplified}</a>.</div>
 <table><tr><th>version</th><th class="num">neurons</th><th class="num">if-conditions (ReLU)</th><th class="num">multiplications</th><th class="num">additions</th><th class="num">rounding steps</th><th class="num">overflow wraps</th><th class="num">accuracy (test)</th><th class="num">same class as the network</th><th>note</th></tr>${N.rows.map(r=>`<tr><td>${esc(r.version)}</td><td class="num">${r.neurons??'—'}</td><td class="num">${r.relus}</td><td class="num">${r.mults}</td><td class="num">${r.adds}</td><td class="num">${r.roundings}</td><td class="num">${r.wraps}</td><td class="num"><b>${pc(r.test)}</b></td><td class="num"><b>${r.same_as_network!=null?pc(r.same_as_network)+(r.same_as_network===1?' ('+(r.n_jets||260000).toLocaleString()+' of '+(r.n_jets||260000).toLocaleString()+')':''):'–'}</b></td><td class="cnt">${esc(r.note)}</td></tr>`).join('')}</table></div>`}
 return h}
function drawMade(){const el=document.getElementById('made');if(el)el.innerHTML=ROS?madeRosetta():madeHTML()}
function rosCompare(){const T=D.tunenet;if(!T)return '';const pc=v=>(100*v).toFixed(2)+'%',net=T.rows[0];
 const lab=r=>r.family==='network'?'the network':r.family==='step 1'?'starting point: if-statements fitted to each of the network’s 16 neurons separately (100 per neuron)':r.family==='labels'?`${parseInt(r.name)} if-statements, tuned on the <i>true labels</i> instead (for comparison)`:`<b>${parseInt(r.name)} if-statements, tuned on the network</b>`;
 return `<div class="card" style="border-left:4px solid #1f4e79"><b>How close the formulas come to the network</b><div class="cnt" style="margin:4px 0">All ${T.n_jets.toLocaleString()} jets of the test file. <b>Same class as the network</b> = share of jets on which the formula gives the network’s answer; <b>accuracy</b> = share given their true class.</div>
 <table class="xt"><tr><th></th><th class="num">same class as the network</th><th class="num">accuracy</th>${CL.map(c=>`<th class="num" style="color:${COL[c]}">${c}</th>`).join('')}</tr>${T.rows.map(r=>`<tr${r.family==='network target'?' style="background:#eef4fb"':''}><td>${lab(r)}</td><td class="num">${r===net?'—':'<b>'+pc(r.same_as_network)+'</b>'}</td><td class="num">${pc(r.accuracy)}</td>${CL.map(c=>{const v=r.per_class[c].rej80;return `<td class="num">${v>=100?v.toFixed(0):v.toFixed(1)}</td>`}).join('')}</tr>`).join('')}</table>
 <div class="cnt" style="margin-top:4px">g … t: background rejection at 80% signal efficiency for that class against the other four (1 / share of the other classes’ jets passing when 80% of the class is kept); the network’s values are in its row.</div></div>`}
function madeRosetta(){const T=D.tunenet,M=(T||{}).method||{},pc=v=>(100*v).toFixed(2)+'%';
 return `<div class="card" style="border-left:4px solid #1d2433"><b>Methodology</b>
 <ol style="margin:6px 0 0 18px;padding:0">
 <li><b>Find if-statements for each neuron.</b> For each of the 16 neurons of the network’s last hidden layer, its value before the ReLU is fitted (least squares, one neuron at a time) by a sum of pieces of jet quantities (${D.exp?D.exp.obs:'no mass-derived quantities: jet mass, masses of particle subsets and mass/pT are excluded'}): the quantity itself, <code>if Q &gt; t: add a·(Q − t)</code>, <code>if Q &lt; t: add a·(t − Q)</code>, or a product of two of these (forward selection, adding at each step the piece that lowers the error most). Nothing about the classes is used here — only the network’s neuron values.</li>
 <li><b>Tune them together on the network’s answers.</b> The first 100 (or 60) pieces of every neuron are kept; all their coefficients are then trained together: formula neurons (rounded to the network’s number grid) → the network’s own, unchanged last layer → class scores → probabilities. The target is the <b>network’s probabilities</b> for each training jet (not the true labels), so the formula learns to decide like the network. The step kept is the one that agrees best with the network on separate validation jets. The if-statements and thresholds stay as step 1 chose them.</li>
 ${D.exp&&D.exp.lam>0?`<li><b>Keep each neuron close to the network’s.</b> Steps 2 and 3 add λ·R to the loss, where R is the mean squared difference between each formula neuron and the network’s neuron in units of that neuron’s variance (λ = ${D.exp.lam}). The 16 neurons reach the class probabilities only through 5 class scores, so without R the tuning can move them in directions that do not change the probabilities; with R the formula neurons stay close to the network’s at unchanged agreement.</li>`:''}
 <li><b>Prune.</b> The pieces that contribute least are removed (15 % at a time, then smaller steps), retraining after each cut; a cut is kept while the agreement with the network on validation jets drops by at most 0.1 point.</li>
 <li><b>For comparison: tuned on the true labels.</b> The formula marked “tuned on true labels” started from the same step 1 (60 pieces per neuron), but step 2 trained its coefficients against the jets’ <i>true</i> classes instead of the network’s probabilities, and pruning kept validation <i>accuracy</i> within 0.1 point. It is about as accurate as the network but agrees with it less often.</li>
 ${D.fam&&Object.values(D.fam).includes('neurons')?`<li><b>For comparison: tuned on the network’s neuron values.</b> The formulas marked “tuned on the network’s neuron values” started from the same step 1 (100 pieces per neuron), but every later step used only the neuron values: step 2 trained the coefficients to minimize R alone (no class scores in the loss), pruning kept the mean validation R² of the neurons (1 − R per neuron) within 0.005, and the smaller version was fitted to the network’s own neurons with its size chosen by mean validation R² within 0.01.</li>`:''}
 <li><b>Smaller versions (optional).</b> More if-statements and whole quantities are removed; after each removal the remaining weights are refitted so that every neuron keeps the values it had in the larger formula (each jet weighted by how much its class depends on that neuron); at the end thresholds are refined and rounded. The size is the smallest within a margin set before testing: 0.5 points of validation agreement with the network (formula tuned on the network) or 0.4 points of validation accuracy (formula tuned on the true labels).</li>
  <li><b>Test once.</b> Every number on this page is on test jets never used for fitting or choosing.</li>
 <li><b>Explanations.</b> The explanations (“Neuron Interpretation”, “Class-Score Decomposition”) are computed from 60,000 training jets; groups of jets are formed only from what each if-statement adds (no labels); the words are written by an AI agent from those numbers and checked automatically against them.</li></ol></div>
 ${T?`<div class="card"><b>The runs</b> <span class="cnt">(number of if-statements after each step; test numbers on all ${T.n_jets.toLocaleString()} jets of the test file)</span><table class="xt" style="margin-top:6px"><tr><th>start</th><th class="num">after steps 1–2</th><th class="num">after pruning (step 3)</th><th class="num">accuracy</th><th class="num">same class as the network</th></tr>${Object.entries(M).sort((a,b)=>b[0]-a[0]).map(([K,r])=>{const f=T.rows.find(x=>x.family==='network target'&&parseInt(x.name)===r.pruned.terms);return `<tr><td>${K} per neuron</td><td class="num">${r.tuned.terms}</td><td class="num">${r.pruned.terms}</td><td class="num">${f?pc(f.accuracy):'–'}</td><td class="num">${f?pc(f.same_as_network):'–'}</td></tr>`}).join('')}</table></div>`:''}`}
function drawPython(){const P=D.py||{},ks=Object.keys(P),el=document.getElementById('python');if(!ks.length){el.innerHTML='<div class="card">No Python export for this network yet.</div>';return}
 if(!P[PYSEL])PYSEL=P['formula 250']?'formula 250':ks[0];const r=P[PYSEL],pc=v=>v==null?'–':(100*v).toFixed(2)+'%';
 const fk=ks.filter(k=>/^formula [\w']+$/.test(k)).map(k=>k.split(' ')[1]).sort(tagOrd),rest=ks.filter(k=>!k.startsWith('formula '));
 const fl=k=>P[k]?`<a class="click" style="${k==PYSEL?'font-weight:700':''}" onclick="PYSEL='${k}';drawPython()">${P[k].file}</a><br><span class="cnt">${P[k].lines.toLocaleString()} lines</span>`:'–';
 let h=filesHTML();
 if(rest.length)h+=`<div class="card"><b>Earlier Python files</b><table style="margin-top:6px"><tr><th>file</th><th class="num">lines</th><th class="num">accuracy (test)</th><th class="num">network accuracy</th><th class="num">same class as the network</th><th class="num">same class as the page’s numbers</th></tr>${rest.map(k=>{const x=P[k];return `<tr class="click" onclick="PYSEL='${k}';drawPython()" style="${k==PYSEL?'background:#eef4fb':''}"><td><b>${x.file}</b></td><td class="num">${x.lines}</td><td class="num">${pc(x.accuracy_file)}</td><td class="num">${pc(x.network_accuracy)}</td><td class="num">${pc(x.agree_with_network_file)}</td><td class="num">${pc(x.same_class_as_pipeline)}</td></tr>`}).join('')}</table></div>`;
 h+=`<div class="card"><b>${r.file}</b> <a class="btn" href="${r.file}" target="_blank" rel="noopener">open</a> <span class="cnt">run it with <code>python3 ${r.file}</code> to classify an example jet</span></div><pre style="max-height:760px;overflow:auto">${r.text!=null?esc(r.text):'loading …'}</pre>`;
 if(r.text==null&&!r._loading){r._loading=1;fetch(r.file).then(x=>x.text()).then(t=>{r.text=t;drawPython()}).catch(e=>{r.text='(could not load '+r.file+' here: '+e+'; open the page from the website)';drawPython()})}
 el.innerHTML=h}
const ROSDRAW={results:drawResults,explain:()=>{drawExplain();drawScores()},scores:()=>{drawExplain();drawScores()},tryjet:drawTryJet,formulas:drawFormulas,made:drawMade,python:drawPython};
function redraw(){drawBar();(ROSDRAW[TAB]||drawResults)()}
{XT=FT=TJ.tag=D.main;PYSEL='formula '+D.main;document.title='Distilling the Latent Space of a Real-Time Jet Tagger into Interpretable Physics Equations';document.querySelector('h1').innerHTML='Distilling the Latent Space of a Real-Time Jet Tagger into Interpretable Physics Equations <span class="cnt" style="font-size:15px;font-weight:400">— the jet tagger’s last hidden layer, translated into if-statements</span>';
 document.getElementById('sub').innerHTML=`${D.exp?`<div style="margin-bottom:6px"><b>Version: ${D.exp.label}.</b> <span class="cnt">Observables: ${D.exp.obs}.</span></div>`:''}The JEDI-linear jet tagger (${D.n} particles; classes g, q, W, Z, t) decides from 16 numbers, its last hidden layer (“jet layer 4”). Here each of those 16 numbers is written as a sum of if-statements on physics quantities of the jet (mass, ΣzΔR², how the pT is shared, …), <b>tuned so that the network’s own last step makes the same decisions as the network</b>. Every number on ${(D.metrics||{n_jets:0}).n_jets.toLocaleString()} test jets.`}
